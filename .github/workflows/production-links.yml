name: Verify published Android links
on:
  push:
    branches: [codex/offline-cross-platform]
    paths:
      - .github/workflows/production-links.yml
      - scripts/verify-production-links.sh
permissions:
  contents: read
jobs:
  signed-apk-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact distributed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v5.0.0-preview --repo "$GITHUB_REPOSITORY" --pattern CasaMichele-v5.0.0-preview.apk
          echo '0f3ca8044c81812d5e1ff54f5f1e0aee8219d330a3caebfd1c6009a8670e2cdd  CasaMichele-v5.0.0-preview.apk' | sha256sum --check
      - name: Enable acceleration for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/verify-production-links.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-android-links
          path: production-link-results/
